<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — AI Recruiter Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">AI Recruiter Copilot</h1>
        <h2 class="text-lg text-gray-600 text-center mb-6">Connexion</h2>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-4">
                <label for="token" class="block text-gray-700 text-sm font-medium mb-2">
                    Token API
                </label>
                <input type="password" name="token" id="token" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Entrez votre token JWT">
                <p class="text-xs text-gray-500 mt-1">
                    Utilisez le token que vous utilisez pour l'API (ex: via /docs)
                </p>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
