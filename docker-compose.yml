version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  chroma_data:
