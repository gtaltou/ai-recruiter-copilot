version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:0.4.22
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
    networks:
      - recruiter_net

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    networks:
      - recruiter_net
    restart: unless-stopped

volumes:
  chroma_data:

networks:
  recruiter_net:
    driver: bridge