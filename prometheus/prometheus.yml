global:
  scrape_interval: 15s          # Récupération toutes les 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-recruiter-copilot"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"
    scheme: http

  - job_name: "ai-recruiter-copilot-docker"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: "/metrics"
    scheme: http
