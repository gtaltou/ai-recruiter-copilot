[pytest]
addopts = -v --cov=app --cov-report=term-missing --cov-report=html:coverage_html --cov-report=xml:coverage.xml --benchmark-disable
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient





